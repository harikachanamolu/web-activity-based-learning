 <style>

    body
        {

    <body>

    <form>
    <h1 align="center"style="color:blue">TICKET BOOKING ONLINE</h1 align="center"><hr>
           <p align="center">fill the details below to book your ticket</p align="center">
             
                <div class="box">
        <label> <b>SELECT YOUR BOOKING TICKET:</b></label><br><br>
        <h2>PASSENGER DETAILS</h2>
         <label><b>ENTER YOUR FIRST NAME:<b></label>
        <input type="text" name="firstname" placeholder="firstname"><br><br>
         <label> ENTER YOUR LAST NAME:</label>
        <input type ="text" name="lastname" placeholder="lastname"><br><br>
         <label>ENTER YOUR MOBILE NUMBER:</label>
         <input type="number" name="number" placeholder="mobile number"><br><br>
           <label>ENTER YOUR EMAIL ID:</label>
            <input type="text" name="email reqiured" placeholder="email"><br><br>
              <label>ENTER YOUR AGE </label>
            <input type="text" name="num" placeholder="age"><br><br>
             <label>ENTER YOUR GENDER:</label><br><br>
            <input type="radio" name="gender" value="MALE">MALE
            <input type="radio" name="gender" value="FEMALE">FEMALE<br>
            <h3>JOURNEY DETAILS:</h3>
         <label>FROM:</label>
        <input type="text" placeholder="Enter starting location">
        <br><br>

        <label>TO:</label>
        <input type="text" placeholder="Enter destination">
        <br><br>
        <label>JOURNEY DATE:</label>
        <input type="date"><br><br>
        <label>JOURNEY ENDS DATE:</label>
        <input type="date"><br><br>
        <label>DESTINATION:</label>
        <input type="text" name="destination" placeholder="destination"><br><br>
        <label>DEPATURE AT:</label>
        <input type="text" name="departure"><br><br>
        <label>ARRIVE AT:</label>
        <input type="text" name="arrive"><br>
         <b><input type="submit" value="BOOK NOW"></b>
         <b><input type="RESET" value="RESET"></b></p>

        </div>
    </form>
